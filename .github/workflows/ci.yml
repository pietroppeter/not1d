name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # not1d is not published: it is installed from source (an sdist, or
  # `uv add git+https://github.com/pietroppeter/not1d`), which compiles the Nim
  # code through nimlang. This job takes that path, then runs the tests,
  # including the comparison with the original ot1d.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the sdist
        run: uv build --sdist --out-dir dist
      - name: Install from the sdist, and ot1d
        run: |
          uv venv test-env
          uv pip install --python test-env dist/*.tar.gz pytest scipy cython setuptools
          # ot1d ships only an sdist, whose build needs Cython and numpy installed first
          uv pip install --python test-env --no-build-isolation ot1d
      - name: Tests
        run: test-env/bin/python -m pytest -v -p no:cacheprovider tests
