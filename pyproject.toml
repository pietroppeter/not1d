[project]
name = "not1d"
version = "0.1.0"
description = "Optimal transport in 1D: a minimal Nim port of ot1d, built with nimlang."
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/pietroppeter/not1d"

[dependency-groups]
dev = ["nimlang>=0.0.2", "pytest", "scipy"]

[build-system]
requires = ["hatchling", "nimlang>=0.0.2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.nimlang]
extensions = ["src/not1d/core.nim"]

[tool.nimlang]
dependencies = [
    "nimpy",
    "https://github.com/pietroppeter/nimpy-numpy",
]

[tool.uv]
# Rebuild the extension when the Nim code changes, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "nimlang.lock" }, { file = "src/**/*.nim" }]
